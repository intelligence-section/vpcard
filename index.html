<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บัตรผ่านเข้า - ออก ค่ายภูมิพล</title>
<style>body{margin:0;font-family:Sarabun,"Noto Sans Thai",sans-serif;background:#f4f1e8;color:#1b2440;display:flex;min-height:100vh;align-items:center;justify-content:center}main{max-width:420px;width:100%;padding:20px}h1{font-size:22px;text-align:center;color:#1f3a8a}a{display:block;margin:12px 0;padding:16px;border-radius:14px;background:#1f3a8a;color:#fff;text-decoration:none;font-weight:700;text-align:center}a.out{background:none;color:#1f3a8a;font-weight:400;font-size:14px;padding:8px}</style></head><body style="display:none"><main><h1>บัตรผ่านเข้า - ออก ค่ายภูมิพล</h1>
<a id="b-app" href="visitor-card-app.html">ทั่วไป (ร้านค้า / โครงการก่อสร้าง ฯลฯ)</a>
<a id="b-stu" href="visitor-card-student.html">นักเรียนหลักสูตร</a>
<a id="b-fam" href="visitor-card-family.html">ครอบครัวกำลังพล</a>
<a href="#" class="out" onclick="logout();return false">ออกจากระบบ</a></main>
<script src="auth.js"></script>
<script>requireLogin().then(u => {
  if (!u) return;
  const show = { Admin: ['b-app','b-stu','b-fam'], Student: ['b-stu'], Family: ['b-fam'] }[u.role] || [];
  ['b-app','b-stu','b-fam'].forEach(id => { if (!show.includes(id)) document.getElementById(id).style.display = 'none'; });
  document.body.style.display = '';
});</script>
</body></html>
