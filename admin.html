<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>จัดการผู้ใช้งาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light dark;--bg:#f4f1e8;--card:#fff;--ink:#14213d;--mut:#6b7385;--navy:#1e3a8a;--on:#fff;--soft:#e8eefb;--line:#e6e1d3;--gold:#e8b923;--red:#d92b2b;--ok:#15803d;--okbg:#dcf6e5;--off:#b42318;--offbg:#fde4e1;--shadow:0 4px 18px rgba(30,58,138,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1426;--card:#171e36;--ink:#eef1fa;--mut:#9aa3bd;--navy:#7d9bff;--on:#0f1426;--soft:#222c52;--line:#283052;--ok:#6ee7a0;--okbg:#14382a;--off:#ff9b90;--offbg:#44201d;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",Tahoma,sans-serif;font-size:14px;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:linear-gradient(100deg,#14286b,#1e3a8a 60%,#2c4fb3);color:#fff;position:relative;padding-top:env(safe-area-inset-top,0px)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--red) 0 33%,var(--gold) 33% 66%,#8a93a8 66%)}
.bar{max-width:1120px;margin:auto;padding:16px 20px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crest{width:54px;height:54px;border-radius:14px;background:#fff;padding:4px;box-shadow:0 0 0 3px rgba(255,255,255,.25)}.crest img{width:100%;height:100%;object-fit:contain;display:block}
.bar h1{font-size:19px;margin:0;font-weight:700}.bar p{margin:2px 0 0;font-size:12px;opacity:.8}
.sp{flex:1}
button,input,select{font:inherit}
.hb{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 14px;font-weight:500;cursor:pointer}
.hb:hover{background:rgba(255,255,255,.22)}
main{max-width:1120px;margin:auto;padding:22px 20px 40px}
.top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h2{margin:0;font-size:24px}.top p{margin:2px 0 0;color:var(--mut)}
.cta{background:var(--navy);color:var(--on);border:0;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center;box-shadow:0 6px 16px rgba(30,58,138,.28)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.st{background:var(--card);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);border-top:4px solid var(--c)}
.ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--b);color:var(--c)}
.st small{color:var(--mut);display:block}.st b{font-size:28px;line-height:1.1}
.filters{background:var(--card);border-radius:16px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow);margin-bottom:16px}
input,select{color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.filters input{flex:1;min-width:200px;width:auto}.filters select{width:auto}
.btn2{border:0;background:var(--soft);color:var(--navy);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.wrap{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1000px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:linear-gradient(var(--soft),transparent)}
td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td:nth-child(1){min-width:270px}td:nth-child(3){min-width:210px}td:nth-child(5){white-space:nowrap}
td b{display:block;line-height:1.45}
.tag{display:inline-block;background:var(--soft);color:var(--navy);border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:600;margin-top:3px}
.code{font-size:11.5px;color:var(--mut);margin-left:6px}
.role{display:inline-block;min-width:170px;max-width:240px;border-radius:14px;padding:6px 14px;font-size:12.5px;font-weight:600;line-height:1.4}
.r-a{background:#fff1c2;color:#8a5a00}.r-s{background:#ece4ff;color:#5b34b5}.r-f{background:#ffe0ea;color:#a3174d}.r-x{background:#e5e7eb;color:#374151}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.on{background:var(--okbg);color:var(--ok)}.off{background:var(--offbg);color:var(--off)}
.act{display:flex;gap:6px}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);display:grid;place-items:center;cursor:pointer;padding:0}
.ib:hover:not(:disabled){color:#fff;background:var(--navy);border-color:var(--navy)}
.ib.pw:hover:not(:disabled){background:var(--red);border-color:var(--red)}
.ib.pw.is-off{color:var(--ok)}
.ib:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.empty{padding:36px;text-align:center;color:var(--mut)}
#m{color:var(--off);margin:0 0 12px;font-size:13px}
dialog{border:0;border-radius:18px;padding:0;width:min(440px,92vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,20,38,.55)}
.dh{padding:18px 22px;border-bottom:1px solid var(--line);font-size:17px;font-weight:700;color:var(--navy)}
.dbd{padding:18px 22px;display:grid;gap:12px}
.dbd label{font-size:12.5px;color:var(--mut);font-weight:600;display:grid;gap:5px}
.pr{display:flex;gap:6px}.pr input{flex:1}.pr button{padding:0 12px}
.dr{display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:14px}.dr span{color:var(--mut)}
.dft{padding:14px 22px 18px;display:flex;gap:10px;justify-content:flex-end}
#de{color:var(--off);font-size:13px;min-height:0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy);color:var(--on);padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style></head><body>
<header><div class="bar">
  <div class="crest"><img src="logo.png" alt="ตราค่ายภูมิพล"></div>
  <div><h1>บัตรผ่านเข้า - ออก ค่ายภูมิพล</h1><p>ศูนย์การทหารปืนใหญ่</p></div>
  <div class="sp"></div>
  <button class="hb" onclick="location.href=HOME_PAGE">ไปหน้าบัตร</button>
  <button class="hb" onclick="uiLogout()">ออกจากระบบ</button>
</div></header>
<main>
  <div class="top">
    <div><h2>จัดการผู้ใช้งาน</h2><p><span id="who"></span> · รายการบัญชีและสิทธิ์การใช้งานของแต่ละหน่วย</p></div>
    <div class="sp"></div>
    <button class="cta" onclick="uiCreate()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6M19 8v6M16 11h6"/></svg>สร้างผู้ใช้ใหม่</button>
  </div>
  <section class="stats" id="stats"></section>
  <div class="filters">
    <input id="q" type="search" placeholder="ค้นหาชื่อ หน่วย อีเมล รหัสหน่วย..." aria-label="ค้นหา">
    <select id="fr" aria-label="สิทธิ์"><option value="">สิทธิ์ (ทั้งหมด)</option></select>
    <select id="fs" aria-label="สถานะ"><option value="">สถานะ (ทั้งหมด)</option><option value="on">Active</option><option value="off">ระงับ</option></select>
    <button class="btn2" id="clr">ล้างตัวกรอง</button>
  </div>
  <div id="m"></div>
  <div class="wrap"><table>
    <thead><tr><th>ข้อมูลหน่วย</th><th>อีเมล</th><th>สิทธิ์การใช้งาน</th><th>สถานะ</th><th>วันที่สร้าง</th><th>จัดการ</th></tr></thead>
    <tbody id="tb"><tr><td colspan="6" class="empty">กำลังโหลดรายชื่อ...</td></tr></tbody>
  </table></div>
</main>
<dialog id="dg"><form id="fm">
  <div class="dh" id="dt"></div><div class="dbd"><div id="db"></div><div id="de" role="alert"></div></div><div class="dft" id="df"></div>
</form></dialog>
<div id="toast" role="status"></div>
<script src="auth.js"></script>
<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uiCK='vpAdminCache';
let me,users=[],uiAct=null,uiLoaded=false;
try{const c=JSON.parse(sessionStorage.getItem(uiCK)||'null');if(c&&c.me&&Array.isArray(c.users)){me=c.me;users=c.users;uiLoaded=true;}}catch(e){}
const uiCache=()=>{try{sessionStorage.setItem(uiCK,JSON.stringify({me:me,users:users}))}catch(e){}};
function uiLogout(){try{sessionStorage.removeItem(uiCK)}catch(e){} logout();}
const RL={Admin:'Admin (ทุกประเภท)',Student:'นักเรียนหลักสูตร',Family:'ครอบครัวกำลังพล'};
const uiRC={Admin:'r-a',Student:'r-s',Family:'r-f'};
const uiERR={UNAUTHORIZED:'หมดเวลาการเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่',FORBIDDEN:'บัญชีนี้ไม่มีสิทธิ์ทำรายการนี้',EMAIL_EXISTS:'มีอีเมลนี้ในระบบแล้ว',WEAK_PASSWORD:'รหัสผ่านต้องมี 8 ตัวขึ้นไป',BAD_EMAIL:'รูปแบบอีเมลไม่ถูกต้อง',MISSING_FIELDS:'กรอกชื่อ ชื่อหน่วย และรหัสหน่วยให้ครบ',BAD_ROLE:'สิทธิ์ไม่ถูกต้อง',NOT_FOUND:'ไม่พบผู้ใช้นี้',CANNOT_BLOCK_SELF:'ระงับบัญชีตัวเองไม่ได้',CANNOT_CHANGE_SELF:'เปลี่ยนสิทธิ์ตัวเองไม่ได้'};
const uiSay=e=>uiERR[e.message]||e.message;
const uiRoleName=r=>RL[r]||(r+' (ยังไม่กำหนดสิทธิ์)');
const uiIC={eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',pen:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',pw:'<path d="M12 2v10M18.4 6.6a9 9 0 11-12.8 0"/>',users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 010 8M22 21c0-3-2-5-4-5.6"/>',ok:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6M16 17l2 2 4-4"/>',no:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6M17 14l5 5M22 14l-5 5"/>',b:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h2M13 8h2M9 12h2M13 12h2M10 21v-4h4v4"/>'};
const uiSvg=(k,s)=>`<svg width="${s||17}" height="${s||17}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${uiIC[k]}</svg>`;
function uiToast(t){const e=$('toast');e.textContent=t;e.className='show';clearTimeout(e._h);e._h=setTimeout(()=>e.className='',2000)}
Object.keys(RL).forEach(k=>$('fr').insertAdjacentHTML('beforeend',`<option value="${k}">${RL[k]}</option>`));

function render(){
  if(me)$('who').textContent=me.name;
  const on=users.filter(u=>u.status==='Active').length;
  const S=[['ผู้ใช้ทั้งหมด',users.length,'users','#1e3a8a','#e8eefb'],['พร้อมใช้งาน (Active)',on,'ok','#15803d','#dcf6e5'],['ระงับการใช้งาน',users.length-on,'no','#d92b2b','#fde4e1'],['จำนวนหน่วยทั้งหมด',new Set(users.map(u=>u.unit)).size,'b','#b8860b','#fff1c2']];
  $('stats').innerHTML=S.map(x=>`<div class="st" style="--c:${x[3]};--b:${x[4]}"><div class="ic">${uiSvg(x[2],22)}</div><div><small>${x[0]}</small><b>${x[1]}</b></div></div>`).join('');
  const q=$('q').value.trim().toLowerCase(),fr=$('fr').value,fs=$('fs').value;
  const list=users.map((u,i)=>[u,i]).filter(([u])=>(!q||[u.name,u.unit,u.code,u.email].join(' ').toLowerCase().includes(q))&&(!fr||u.role===fr)&&(!fs||(fs==='on')===(u.status==='Active')));
  $('tb').innerHTML=list.length?list.map(([u,i])=>{
    const self=!!me&&u.email===me.email,on=u.status==='Active';
    return `<tr><td><b>${esc(u.name)}</b><span class="tag">${esc(u.unit)}</span><span class="code">${esc(u.code)}</span></td>
    <td>${esc(u.email)}</td><td><span class="role ${uiRC[u.role]||'r-x'}">${esc(uiRoleName(u.role))}</span></td>
    <td><span class="pill ${on?'on':'off'}"><i></i>${on?'Active':'ระงับ'}</span></td>
    <td>${new Date(u.created).toLocaleString('th-TH')}</td>
    <td><div class="act"><button class="ib" title="ดูรายละเอียด" aria-label="ดูรายละเอียด" onclick="uiView(${i})">${uiSvg('eye')}</button>
    <button class="ib" title="เปลี่ยนสิทธิ์" aria-label="เปลี่ยนสิทธิ์" ${self?'disabled':''} onclick="uiEditRole(${i})">${uiSvg('pen')}</button>
    <button class="ib pw${on?'':' is-off'}" title="${on?'ระงับ':'เปิดใช้งาน'}" aria-label="${on?'ระงับ':'เปิดใช้งาน'}" ${self?'disabled':''} onclick="toggle(${i})">${uiSvg('pw')}</button></div></td></tr>`;
  }).join(''):'<tr><td colspan="6" class="empty">'+(uiLoaded?'ไม่พบผู้ใช้ที่ตรงกับตัวกรอง ลองล้างตัวกรองแล้วค้นหาใหม่':'กำลังโหลดรายชื่อ...')+'</td></tr>';
}
async function load(){ try{ users=(await api('listUsers')).users; uiLoaded=true; $('m').textContent=''; uiCache(); render(); }catch(e){ uiLoaded=true; if(e.message!=='UNAUTHORIZED')$('m').textContent=uiSay(e); render(); } }

function uiDlg(title,body,foot,onSave){ $('dt').textContent=title; $('db').innerHTML=body; $('df').innerHTML=foot; $('de').textContent=''; uiAct=onSave||null; $('dg').showModal(); }
const uiClose=()=>$('dg').close();
const uiCANCEL='<button type="button" class="btn2" onclick="uiClose()">ยกเลิก</button>';
const uiSAVE='<button type="submit" class="cta">บันทึก</button>';
$('fm').onsubmit=e=>{ e.preventDefault(); if(uiAct) uiAct(); };

function uiView(i){
  const u=users[i];
  uiDlg('รายละเอียดผู้ใช้',`<div class="dr"><span>ชื่อผู้ใช้</span><b>${esc(u.name)}</b><span>ชื่อหน่วย</span><div>${esc(u.unit)}</div><span>รหัสหน่วย</span><div>${esc(u.code)}</div><span>อีเมล</span><div>${esc(u.email)}</div><span>สิทธิ์</span><div>${esc(uiRoleName(u.role))}</div><span>สถานะ</span><div>${u.status==='Active'?'Active':'ระงับ'}</div><span>วันที่สร้าง</span><div>${new Date(u.created).toLocaleString('th-TH')}</div></div>`,'<button type="button" class="btn2" onclick="uiClose()">ปิด</button>');
}
function uiEditRole(i){
  const u=users[i];
  uiDlg('เปลี่ยนสิทธิ์การใช้งาน',`<div><b>${esc(u.name)}</b><div class="code" style="margin:0">${esc(u.email)}</div></div><label>สิทธิ์การใช้งาน<select id="r2">${Object.keys(RL).map(k=>`<option value="${k}" ${k===u.role?'selected':''}>${RL[k]}</option>`).join('')}</select></label>`,uiCANCEL+uiSAVE,async()=>{
    const nr=$('r2').value,old=u.role; u.role=nr; uiCache(); uiClose(); render(); uiToast('บันทึกสิทธิ์แล้ว');
    try{ await api('setRole',{email:u.email,role:nr}); }catch(e){ u.role=old; uiCache(); render(); $('m').textContent=uiSay(e); }
  });
}
async function toggle(i){
  const u=users[i],block=u.status==='Active';
  if(!confirm((block?'ระงับ ':'เปิดใช้งาน ')+u.name+' ?'))return;
  const old=u.status; u.status=block?'Blocked':'Active'; uiCache(); render(); uiToast(block?'ระงับผู้ใช้แล้ว':'เปิดใช้งานแล้ว');
  try{ await api('setStatus',{email:u.email,status:u.status}); }catch(e){ u.status=old; uiCache(); render(); $('m').textContent=uiSay(e); }
}
function uiCreate(){
  uiDlg('สร้างผู้ใช้ใหม่',`<label>ชื่อผู้ใช้ (ยศ ชื่อ นามสกุล)<input id="n" autocomplete="off"></label><label>ชื่อหน่วย<input id="u" autocomplete="off"></label><label>รหัสหน่วย<input id="c" autocomplete="off"></label><label>อีเมล<input id="e" type="email" autocomplete="off"></label>
  <label>รหัสผ่าน (8 ตัวขึ้นไป)<div class="pr"><input id="p" type="password" autocomplete="new-password"><button type="button" class="btn2" onclick="$('p').type=$('p').type==='password'?'text':'password'">ดู</button><button type="button" class="btn2" onclick="uiGen()">สุ่ม</button></div></label>
  <label>สิทธิ์การใช้งาน<select id="r">${Object.keys(RL).map(k=>`<option value="${k}" ${k==='Student'?'selected':''}>${RL[k]}</option>`).join('')}</select></label>`,uiCANCEL+uiSAVE,async()=>{
    const d={name:$('n').value.trim(),unit:$('u').value.trim(),code:$('c').value.trim(),email:$('e').value.trim().toLowerCase(),password:$('p').value,role:$('r').value};
    const bad=!d.name||!d.unit||!d.code?'MISSING_FIELDS':!/^\S+@\S+\.\S+$/.test(d.email)?'BAD_EMAIL':d.password.length<8?'WEAK_PASSWORD':users.some(x=>String(x.email).toLowerCase()===d.email)?'EMAIL_EXISTS':'';
    if(bad){ $('de').textContent=uiERR[bad]; return; }
    const b=document.querySelector('#df .cta'); b.disabled=true; b.textContent='กำลังบันทึก...';
    try{
      await api('createUser',d);
      users.push({name:d.name,unit:d.unit,code:d.code,email:d.email,role:d.role,status:'Active',created:Date.now()});
      uiCache(); uiClose(); render(); uiToast('สร้างผู้ใช้แล้ว'); load();
    }catch(e){ b.disabled=false; b.textContent='บันทึก'; $('de').textContent=uiSay(e); }
  });
}
function uiGen(){ const a='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint32Array(12)); $('p').value=[...r].map(x=>a[x%a.length]).join(''); $('p').type='text'; }

['q','fr','fs'].forEach(id=>$(id).addEventListener('input',render));
$('clr').onclick=()=>{ $('q').value=''; $('fr').value=''; $('fs').value=''; render(); };
render(); load();
requireLogin(true).then(u=>{ if(!u){ try{sessionStorage.removeItem(uiCK)}catch(e){} return; } me=u; uiCache(); render(); });
</script></body></html>
