<style>
:root{--bg:#f4f1e8;--sf:#fff;--tx:#1b2440;--mu:#6b7186;--bd:#ddd6c2;--pr:#1f3a8a;--er:#b3261e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);font-family:Sarabun,"Noto Sans Thai",sans-serif}
main{width:100%;max-width:420px;padding:20px;text-align:center}
.logo{display:block;margin:0 auto 14px;width:150px;max-width:50%;height:auto}
.hd{font-size:22px;font-weight:800;color:var(--pr);margin:0 0 4px}
.card{background:var(--sf);border-radius:20px;padding:24px 24px 26px;box-shadow:0 8px 28px rgba(27,36,64,.10);text-align:left}
p.sub{text-align:center;color:var(--mu);margin:0 0 18px;font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
input{width:100%;padding:13px 14px;border:1px solid var(--bd);border-radius:12px;font:inherit;font-size:16px;background:#e8eefc}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--pr);color:#fff;font:700 16px Sarabun,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:20px;margin-top:12px;text-align:center;font-size:14px;color:var(--er)}
.help{margin-top:18px;text-align:center;color:var(--mu);font-size:13px;line-height:1.6}.help a{color:var(--pr);font-weight:700;text-decoration:none}

<h1 class="hd">บัตรผ่านเข้า - ออก ค่ายภูมิพล</h1><p class="sub">เข้าสู่ระบบเพื่อใช้งาน</p>
<div class="card">
<label for="em">อีเมล</label><input id="em" type="email" autocomplete="username" inputmode="email">
<label for="pw">รหัสผ่าน</label><input id="pw" type="password" autocomplete="current-password">
<button id="go">เข้าสู่ระบบ</button><div id="msg" role="alert"></div>
</div>
<div class="help">ลืมรหัสผ่าน ติดต่อเจ้าหน้าที่<br><a href="tel:0891620618">โทร 089-162-0618</a><br>แผนกการข่าว และ รปภ.</div>
</main>
<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbyx8smVvvVD8n0DTGKe0pBZHLVeZD2yIbwZniG7JQzXQ5iTbDzrFc6iapYIxdelliEs/exec';
const HOME={admin:'visitor-card-app.html',student:'visitor-card-student.html',family:'visitor-card-family.html'};
const $=id=>document.getElementById(id);
function goHome(S){location.replace(HOME[S.role]||'login.html')}
try{const S=JSON.parse(sessionStorage.getItem('vp_sess')||'null');if(S&&S.token&&HOME[S.role]&&(!S.exp||Date.now()<S.exp))goHome(S)}catch(e){}
async function login(){
  const em=$('em').value.trim(),pw=$('pw').value,m=$('msg'),b=$('go');
  if(!em||!pw){m.textContent='กรอกอีเมลและรหัสผ่านให้ครบ';return}
  b.disabled=true;m.style.color='var(--mu)';m.textContent='กำลังตรวจสอบ...';
  try{
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),30000);
    const r=await fetch(WEB_APP_URL,{method:'POST',body:JSON.stringify({action:'login',email:em,password:pw}),signal:ctl.signal});
    clearTimeout(tm);const j=await r.json();
    if(!j||!j.ok)throw new Error((j&&j.error)||'เข้าสู่ระบบไม่สำเร็จ');
    sessionStorage.setItem('vp_sess',JSON.stringify({token:j.token,role:j.role,exp:j.exp,email:j.email,name:j.name}));
    goHome(j);
  }catch(e){m.style.color='var(--er)';m.textContent=e&&e.name==='AbortError'?'เซิร์ฟเวอร์ไม่ตอบกลับ ลองใหม่อีกครั้ง':(e.message||'เข้าสู่ระบบไม่สำเร็จ');b.disabled=false}
}
$('go').onclick=login;
['em','pw'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')login()}));
</script></body></html>
