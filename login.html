<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เข้าสู่ระบบ - บัตรผ่านเข้า-ออก ค่ายภูมิพล</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<style>
:root{--bg:#f4f1e8;--navy:#1f3a8a;--navy2:#172c6b;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:#1f2937;font-family:"Noto Sans Thai",system-ui,sans-serif}
.wrap{width:100%;max-width:420px;text-align:center}
.logo{width:150px;max-width:45%;height:auto;display:block;margin:0 auto 14px}
h1{margin:0;font-size:22px;color:var(--navy);font-weight:700}
.sub{margin:4px 0 22px;color:#6b7280;font-size:14px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 4px 18px rgba(31,58,138,.10);text-align:left}
label{display:block;font-size:13px;font-weight:500;color:var(--navy);margin:0 0 6px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #d6d3c8;background:#fbfaf6;font:inherit;color:inherit;margin-bottom:14px}
input:focus{outline:2px solid var(--navy);outline-offset:-1px;background:#fff}
button{width:100%;padding:13px;border:0;border-radius:14px;background:var(--navy);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:4px}
button:hover{background:var(--navy2)}button:disabled{opacity:.6;cursor:wait}
#err{display:none;margin-bottom:12px;padding:10px 12px;border-radius:10px;background:#fee2e2;color:#b91c1c;font-size:13px}
.help{margin-top:18px;font-size:13px;line-height:1.7;color:#4b5563;text-align:center}
.help a{color:var(--navy);font-weight:700;text-decoration:none;white-space:nowrap}
</style></head><body>
<div class="wrap">
  <img class="logo" src="logo.png" alt="ค่ายภูมิพล ศูนย์การทหารปืนใหญ่">
  <h1>บัตรผ่านเข้า - ออก ค่ายภูมิพล</h1>
  <p class="sub">เข้าสู่ระบบเพื่อใช้งาน</p>
  <div class="card">
    <label for="e">อีเมล</label><input id="e" type="email" autocomplete="username" placeholder="name@example.com">
    <label for="p">รหัสผ่าน</label><input id="p" type="password" autocomplete="current-password" placeholder="••••••••">
    <div id="err"></div>
    <button id="b">เข้าสู่ระบบ</button>
  </div>
  <p class="help">ลืมรหัสผ่าน ติดต่อเจ้าหน้าที่<br><a href="tel:0891620618">โทร 089-162-0618</a><br>แผนกการข่าว และ รปภ.</p>
</div>
<script src="auth.js"></script>
<script>
const $=i=>document.getElementById(i);
async function go(){
  $('err').style.display='none'; $('b').disabled=true;
  try{
    const j=await api('login',{email:$('e').value,password:$('p').value});
    sessionStorage.setItem('vp_token',j.token);
    location.href=landing(j.user.role);
  }catch(e){ $('err').textContent=e.message; $('err').style.display='block'; }
  $('b').disabled=false;
}
$('b').onclick=go;
['e','p'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
</script></body></html>
